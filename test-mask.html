<!DOCTYPE html>
<html>
<body style="background: #e0e0e0; padding: 50px;">
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- Mask to hide lines behind the center person -->
    <mask id="center-person-mask">
      <rect x="0" y="0" width="24" height="24" fill="white" />
      <!-- Cut out the center person with a slightly larger radius for stroke clearance, or just exact? 
           Actually, fill="black" means hide. We stroke and fill the center person in black. -->
      <circle cx="12" cy="11" r="5" fill="black" />
      <path d="M18 21v-2a4 4 0 0 0-4-4h-4a4 4 0 0 0-4 4v2" fill="black" stroke="black" stroke-width="2" />
    </mask>
  </defs>

  <!-- Background People (masked) -->
  <g mask="url(#center-person-mask)">
    <!-- Left Person -->
    <circle cx="6" cy="8" r="3.5" />
    <path d="M1 21v-2a4 4 0 0 1 4-4h2" />
    
    <!-- Right Person -->
    <circle cx="18" cy="8" r="3.5" />
    <path d="M23 21v-2a4 4 0 0 0-4-4h-2" />
  </g>

  <!-- Center Person (Front) -->
  <circle cx="12" cy="11" r="4" />
  <path d="M18 21v-2a4 4 0 0 0-4-4h-4a4 4 0 0 0-4 4v2" />

</svg>
</body>
</html>
