    <!-- Early Multi-Vendor Wildcard Subdomain Detection -->
    <script data-cfasync="false">
      (function() {
        try {
          var host = (window.location.hostname || '').toLowerCase().split(':')[0];
          var searchParams = new URLSearchParams(window.location.search);
          var testSub = searchParams.get('test_shop_domain') || searchParams.get('subdomain');
          if (testSub) {
            window.__RJ_VENDOR_SUBDOMAIN__ = testSub.toLowerCase().trim().replace('.rjworldbd.com', '').replace('.rjworld.com', '');
          } else if (host.endsWith('.rjworldbd.com') && host !== 'rjworldbd.com' && host !== 'www.rjworldbd.com') {
            var sub = host.replace('.rjworldbd.com', '').trim();
            var reserved = ['www', 'admin', 'api', 'mail', 'cpanel', 'webmail', 'ftp', 'app', 'auth', 'support'];
            if (reserved.indexOf(sub) === -1) {
              window.__RJ_VENDOR_SUBDOMAIN__ = sub;
            }
          }
        } catch(e) {}
      })();
    </script>

    <!-- Splash Screen Styles & Smooth Dismissal Script -->
    <style>
      .rj-splash-container {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        overflow: hidden;
        cursor: pointer;
        background: radial-gradient(ellipse at 50% 45%, #0d224a 0%, #061226 50%, #030814 100%);
        transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1), transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: opacity, transform;
        transform: scale(1);
        opacity: 1;
      }
      .rj-splash-bg-grid {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.04;
        background-image: radial-gradient(rgba(56, 189, 248, 0.7) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .rj-splash-blue-aura {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 440px;
        height: 440px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(14, 165, 233, 0.25) 0%, rgba(37, 99, 235, 0.18) 40%, transparent 70%);
        filter: blur(60px);
        pointer-events: none;
        animation: rjPulseAura 4s ease-in-out infinite alternate;
      }
      .rj-splash-blue-core {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(29, 78, 216, 0.2) 50%, transparent 80%);
        filter: blur(35px);
        pointer-events: none;
      }
      .rj-splash-particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .rj-p {
        position: absolute;
        border-radius: 50%;
        background-color: #7dd3fc;
        box-shadow: 0 0 8px rgba(56, 189, 248, 0.9);
        animation: rjFloatParticle ease-in-out infinite alternate;
      }
      .rj-splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        z-index: 2;
      }
      .rj-ring {
        position: absolute;
        top: 70px;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        pointer-events: none;
      }
      .rj-ring-1 {
        width: 170px;
        height: 170px;
        border: 1.5px solid rgba(56, 189, 248, 0.45);
        box-shadow: 0 0 24px rgba(56, 189, 248, 0.25);
        animation: rjRingPulse 2.8s cubic-bezier(0.1, 0, 0.2, 1) infinite;
      }
      .rj-ring-2 {
        width: 220px;
        height: 220px;
        border: 1px solid rgba(37, 99, 235, 0.35);
        box-shadow: 0 0 35px rgba(37, 99, 235, 0.2);
        animation: rjRingPulse 2.8s cubic-bezier(0.1, 0, 0.2, 1) 0.5s infinite;
      }
      .rj-ring-3 {
        width: 280px;
        height: 280px;
        border: 1px dashed rgba(125, 211, 252, 0.2);
        animation: rjRingRotate 20s linear infinite;
      }
      .rj-logo-pure-wrap {
        position: relative;
        width: 140px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent !important;
      }
      .rj-logo-blue-glow {
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.5) 0%, rgba(37, 99, 235, 0.3) 50%, transparent 75%);
        filter: blur(18px);
        opacity: 0.9;
        pointer-events: none;
        animation: rjLogoGlow 2.5s ease-in-out infinite alternate;
      }
      .rj-shimmer-sweep {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
        background: linear-gradient(135deg, transparent 20%, rgba(255, 255, 255, 0.28) 50%, transparent 80%);
        opacity: 0;
        animation: rjPureShimmer 2.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }
      .rj-logo-pure-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: transparent !important;
        filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 20px rgba(56, 189, 248, 0.55));
        animation: rjLogoReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .rj-brand-info {
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: rjFadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        opacity: 0;
      }
      .rj-title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 1.5px;
        background: linear-gradient(180deg, #FFFFFF 20%, #BAE6FD 65%, #60A5FA 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
      }
      .rj-subtitle {
        margin-top: 5px;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.5px;
        color: #7dd3fc;
        opacity: 0.85;
      }
      .rj-indicators {
        margin-top: 24px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .rj-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        animation: rjDotPulse 1.2s ease-in-out infinite;
      }
      .rj-dot-1 { background-color: #38bdf8; box-shadow: 0 0 8px #38bdf8; animation-delay: 0s; }
      .rj-dot-2 { background-color: #2563eb; box-shadow: 0 0 8px #2563eb; animation-delay: 0.2s; }
      .rj-dot-3 { background-color: #60a5fa; box-shadow: 0 0 8px #60a5fa; animation-delay: 0.4s; }
      .rj-splash-footer {
        position: absolute;
        bottom: 24px;
        font-family: 'Inter', sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 2px;
        color: rgba(148, 163, 184, 0.6);
        text-transform: uppercase;
      }

      @keyframes rjLogoReveal {
        0% { transform: scale(0.85); opacity: 0; }
        45% { transform: scale(1.06); opacity: 1; }
        70% { transform: scale(0.98); }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes rjFadeUp {
        0% { transform: translateY(12px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      @keyframes rjLogoGlow {
        0% { opacity: 0.6; transform: scale(0.95); }
        100% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes rjPureShimmer {
        0% { opacity: 0; transform: rotate(0deg) scale(0.85); }
        30% { opacity: 0.8; }
        60% { opacity: 0.3; }
        100% { opacity: 0; transform: rotate(180deg) scale(1.15); }
      }
      @keyframes rjPulseAura {
        0% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.7; }
        100% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
      }
      @keyframes rjRingPulse {
        0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.6; }
        70% { transform: translate(-50%, -50%) scale(1.22); opacity: 0; }
        100% { transform: translate(-50%, -50%) scale(1.22); opacity: 0; }
      }
      @keyframes rjRingRotate {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
      }
      @keyframes rjShimmer {
        0% { transform: translateX(-150%) skewX(-15deg); }
        45%, 100% { transform: translateX(200%) skewX(-15deg); }
      }
      @keyframes rjFloatParticle {
        0% { transform: translateY(0) scale(0.8); opacity: 0.2; }
        50% { transform: translateY(-14px) scale(1.2); opacity: 0.9; }
        100% { transform: translateY(-28px) scale(0.8); opacity: 0.2; }
      }
      @keyframes rjDotPulse {
        0%, 100% { transform: scale(0.8); opacity: 0.4; }
        50% { transform: scale(1.2); opacity: 1; }
      }
    </style>

    <script data-cfasync="false">
      (function() {
        let dismissed = false;
        let minTimePassed = false;
        let appReady = false;

        function dismiss() {
          if (dismissed) return;
          dismissed = true;
          const splash = document.getElementById('rj-splash-screen');
          if (!splash) return;
          splash.style.opacity = '0';
          splash.style.transform = 'scale(1.03)';
          splash.style.pointerEvents = 'none';
          setTimeout(function() {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 600);
        }

        window.dismissSplashScreen = dismiss;
        window.markAppReady = function() {
          appReady = true;
          if (minTimePassed) {
            dismiss();
          }
        };

        // Minimum display duration: exactly 3.0 seconds (3000ms) per user specification
        setTimeout(function() {
          minTimePassed = true;
          if (appReady) {
            dismiss();
          }
        }, 3000);

        // Fallback safety timeout (4000ms)
        setTimeout(dismiss, 4000);

        // Instant tap to skip
        const splashEl = document.getElementById('rj-splash-screen');
        if (splashEl) {
          splashEl.addEventListener('click', function() {
            dismiss();
          }, { once: true });
        }
      })();
    </script>
